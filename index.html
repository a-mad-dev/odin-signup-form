<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | App</title>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link href="https://fonts.cdnfonts.com/css/norse" rel="stylesheet">               
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="logo-bg">
                <img src="./assets/odin-lined.png" alt="Logo" class="logo">
                <h1 class="logo-text">ODIN</h1>
            </div>
            <!-- <img src="./assets/bg.png" alt="Background" class="bg"> Add this via CSS -->
            <span class="credits-bg">Photo by Halie West on Unsplash</span>
        </div>
        <div class="main">
            <div class="header-section">
                <p class="text hero-text">This is not an online service. You know you need something like this in your life to help you realize your deepest dreams.</p>
                <p class="cta-text text">Sign up <em>now</em> to get started.</p>
                <p class="sub-hero">You <em>know</em> you want to.</p>
            </div>
            <div class="form-section">
                <p class="form-msg">Let's do this!</p>
                <form action="" class="form">
                    <div class="inputs">
                        <div class="field">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="firstName" placeholder="John" required>
                        </div>
                        <div class="field">
                            <label for="last-name">Last Name</label>
                            <input type="text" name="lastName" id="last-name" placeholder="Doe..." required>
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email" placeholder="johndoe@example.com" required>
                        </div>
                        <div class="field">
                            <label for="phone">Phone Number</label>
                            <input type="tel" name="phone" id="phone" placeholder="+123 456 789..." required>
                        </div>
                        <div class="field">
                            <label for="pass">Password</label>
                            <input type="password" name="password" id="pass" required>
                        </div>
                        <div class="field">
                            <label for="pass-confirm">Confirm Password</label>
                            <input type="password" name="password-confirm" id="pass-confirm" required>
                        </div>
                    </div>
                    <div class="submit-section">
                        <button type="submit" class="submit">Create account</button>
                        <p class="log-in-q">Already have an account? <a href="#" class="login-lnk"><b>Log in</b></a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
